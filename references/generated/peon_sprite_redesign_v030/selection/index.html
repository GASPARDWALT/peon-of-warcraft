<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peon of Warcraft — class-master proposal</title><style>body{margin:0;padding:24px;background:#100b13;color:#f7e9bd;font:16px system-ui;max-width:1000px;margin:auto}h1{font-size:24px}p{max-width:76ch;line-height:1.5}img{image-rendering:pixelated;image-rendering:crisp-edges;width:min(100%,800px);height:auto;display:block;border:1px solid #78412b}button{background:#20151a;color:#f7e9bd;border:1px solid #b67b37;padding:12px;margin:12px 8px 12px 0;cursor:pointer}button[aria-pressed=true]{outline:2px solid #efbd70}a{color:#efbd70}small{color:#b7a98a}</style><h1>Choose your class master</h1><p>Art proposal at <strong>160 × 144 native pixels</strong>. This preview does not change the ROM.</p><div id="buttons"><button data-i="0" aria-pressed="true">Kento — Shaman</button><button data-i="1" aria-pressed="false">Zogzog — Warrior</button><button data-i="2" aria-pressed="false">Xasthur — Warlock</button></div><img id="screen" src="class_master_kento_160x144.png" width="160" height="144" alt="Kento Brandenhoof class-master selection"><p><a id="download" href="class_master_kento_160x144.png" download>Download native 160 × 144 PNG</a> · <a href="class_master_selection_contact_sheet_4x.png">See all three states</a></p><small>RGB555 source colours. Per-tile palette mapping, VRAM budget and ROM integration have not been implemented.</small><script>const ids=['kento','zogzog','xasthur'];let current=0;function select(i){current=(i+3)%3;const file='class_master_'+ids[current]+'_160x144.png';document.querySelector('#screen').src=file;document.querySelector('#screen').alt=ids[current]+' class-master selection';document.querySelector('#download').href=file;document.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',j===current?'true':'false'));}document.querySelectorAll('button').forEach(b=>b.onclick=()=>select(Number(b.dataset.i)));document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();select(current-1);}if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();select(current+1);}});</script></html>
